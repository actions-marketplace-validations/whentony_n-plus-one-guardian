name: 'N-Plus-One Guardian'
description: 'Detecta problemas de N+1 queries em PHP, TypeScript e Python, comentando diretamente no Pull Request.'
author: 'Whentony'
branding:
  icon: 'alert-triangle'
  color: 'red'

inputs:
  github_token:
    description: 'Token de autenticação do GitHub (geralmente secrets.GITHUB_TOKEN)'
    required: true

runs:
  using: 'node20'
  main: 'dist/index.js'
